http:
  routers:
{{ if has "app2" (splitList "," (env "ACTIVE_PROFILES")) }}
    app2-http:
      priority: 10
      middlewares: [app-security-app2{{ if eq (env "APP_TLS_ENABLED") "true" }}, force-https{{ end }}]
      rule: 'Host(`{{ env "APP_2_DOMAIN" }}`)'
      entryPoints: [web]
      service: app2
    app2-http-browser:
      priority: 50
      middlewares: [jubart-errors, app-security-app2{{ if eq (env "APP_TLS_ENABLED") "true" }}, force-https{{ end }}]
      rule: '(Host(`{{ env "APP_2_DOMAIN" }}`)) && (Method(`GET`) || Method(`HEAD`)) && HeaderRegexp(`Accept`, `(?i)text/html`) && !HeaderRegexp(`X-Inertia`, `.+`) && !HeaderRegexp(`Upgrade`, `.+`)'
      entryPoints: [web]
      service: app2
{{ if eq (env "APP_TLS_ENABLED") "true" }}
    app2-https:
      priority: 10
      middlewares: [app-security-app2]
      rule: 'Host(`{{ env "APP_2_DOMAIN" }}`)'
      entryPoints: [websecure]
      service: app2
      tls:
        certResolver: letsencrypt
    app2-https-browser:
      priority: 50
      middlewares: [jubart-errors, app-security-app2]
      rule: '(Host(`{{ env "APP_2_DOMAIN" }}`)) && (Method(`GET`) || Method(`HEAD`)) && HeaderRegexp(`Accept`, `(?i)text/html`) && !HeaderRegexp(`X-Inertia`, `.+`) && !HeaderRegexp(`Upgrade`, `.+`)'
      entryPoints: [websecure]
      service: app2
      tls:
        certResolver: letsencrypt
{{ end }}
{{ end }}
{{ if has "app3" (splitList "," (env "ACTIVE_PROFILES")) }}
    app3-http:
      priority: 10
      middlewares: [app-security-app3{{ if eq (env "APP_TLS_ENABLED") "true" }}, force-https{{ end }}]
      rule: 'Host(`{{ env "APP_3_DOMAIN" }}`)'
      entryPoints: [web]
      service: app3
    app3-http-browser:
      priority: 50
      middlewares: [jubart-errors, app-security-app3{{ if eq (env "APP_TLS_ENABLED") "true" }}, force-https{{ end }}]
      rule: '(Host(`{{ env "APP_3_DOMAIN" }}`)) && (Method(`GET`) || Method(`HEAD`)) && HeaderRegexp(`Accept`, `(?i)text/html`) && !HeaderRegexp(`X-Inertia`, `.+`) && !HeaderRegexp(`Upgrade`, `.+`)'
      entryPoints: [web]
      service: app3
{{ if eq (env "APP_TLS_ENABLED") "true" }}
    app3-https:
      priority: 10
      middlewares: [app-security-app3]
      rule: 'Host(`{{ env "APP_3_DOMAIN" }}`)'
      entryPoints: [websecure]
      service: app3
      tls:
        certResolver: letsencrypt
    app3-https-browser:
      priority: 50
      middlewares: [jubart-errors, app-security-app3]
      rule: '(Host(`{{ env "APP_3_DOMAIN" }}`)) && (Method(`GET`) || Method(`HEAD`)) && HeaderRegexp(`Accept`, `(?i)text/html`) && !HeaderRegexp(`X-Inertia`, `.+`) && !HeaderRegexp(`Upgrade`, `.+`)'
      entryPoints: [websecure]
      service: app3
      tls:
        certResolver: letsencrypt
{{ end }}
{{ end }}
  services:
    app2:
      loadBalancer:
        servers:
          - url: http://php-app2:{{ env "APP_2_UPSTREAM_PORT" }}
    app3:
      loadBalancer:
        servers:
          - url: http://php-app3:{{ env "APP_3_UPSTREAM_PORT" }}
