; Sessões nativas do PHP. Laravel possui configuração de sessões própria.
session.save_handler = files
session.save_path = /tmp
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.cookie_httponly = 1
session.cookie_samesite = Lax
; Local HTTP: 0. Em HTTPS, configure PHP_SESSION_COOKIE_SECURE=1 no .env.
session.cookie_secure = ${PHP_SESSION_COOKIE_SECURE}
session.cookie_lifetime = 0
session.gc_maxlifetime = ${PHP_SESSION_GC_MAXLIFETIME}
session.gc_probability = 1
session.gc_divisor = 1000
; Recomendação de segurança do PHP: manter desativado.
session.upload_progress.enabled = 0
