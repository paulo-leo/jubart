name: Docker Hub

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar a versão atual no Docker Hub (somente na main)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-hub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Testar e construir imagem
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_FILE: compose.yaml
      COMPOSE_ENV_FILES: .env.example
      PANEL_PASSWORD: Test-only-password-123456
      PANEL_VAULT_KEY: Test-only-key
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docker/panel/package-lock.json

      - name: Validar versão e definir publicação
        id: release
        env:
          REQUEST_PUBLISH: ${{ inputs.publish == true }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          package = json.loads(Path('docker/panel/package.json').read_text())
          lock = json.loads(Path('docker/panel/package-lock.json').read_text())
          version = package['version']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('A versão deve usar o formato X.Y.Z, sem prefixo v.')
          if lock['version'] != version or lock['packages']['']['version'] != version:
              raise SystemExit('As versões do package.json e do lockfile devem coincidir.')
          ref = os.environ['GITHUB_REF']
          tagged = ref.startswith('refs/tags/')
          if tagged and ref != 'refs/tags/v' + version:
              raise SystemExit('A tag deve ser v' + version + ', igual à versão do painel.')
          manual = os.environ['REQUEST_PUBLISH'] == 'true'
          if manual and ref != 'refs/heads/main':
              raise SystemExit('A publicação manual deve usar a branch main.')
          publish = tagged or manual
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\npublish={str(publish).lower()}\n')
          PY

      - name: Instalar dependências e sincronizar logo
        run: |
          npm ci --prefix docker/panel --ignore-scripts
          node scripts/sync-brand.mjs

      - name: Testar CLI e painel
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_jubart*.py'
          npm test --prefix docker/panel

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir imagem para validação
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./docker/panel
          platforms: linux/amd64
          load: true
          push: false
          tags: paulo2021/jubart:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.title=Jubart
            org.opencontainers.image.source=https://github.com/paulo-leo/jubart
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Testar imagem final em container isolado
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: python3 scripts/test-release-image.py "paulo2021/jubart:$VERSION"

      - name: Conferir credencial de publicação
        if: steps.release.outputs.publish == 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo '::error::Cadastre DOCKERHUB_TOKEN nos secrets de Actions do repositório (token Docker Hub com Read & Write).'
            exit 1
          fi

      - name: Autenticar no Docker Hub
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: paulo2021
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar a imagem testada
        if: steps.release.outputs.publish == 'true'
        env:
          IMAGE: paulo2021/jubart:${{ steps.release.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /tmp/manifest.txt 2> /tmp/manifest-error.txt; then
            echo "::error::A versão $IMAGE já existe. Incremente a versão para publicar uma nova release."
            exit 1
          elif ! grep -Eq '(not found|manifest unknown)' /tmp/manifest-error.txt; then
            cat /tmp/manifest-error.txt >&2
            exit 1
          fi
          docker push "$IMAGE"
          docker buildx imagetools inspect "$IMAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Resumir validação
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PUBLISHED: ${{ steps.release.outputs.publish }}
        run: |
          echo "Imagem validada: paulo2021/jubart:$VERSION (linux/amd64)." >> "$GITHUB_STEP_SUMMARY"
          if [ "$PUBLISHED" = true ]; then
            echo 'Publicada no Docker Hub. Nenhum deploy foi executado.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Somente validação. Publique por tag vX.Y.Z ou execução manual com publish habilitado.' >> "$GITHUB_STEP_SUMMARY"
          fi
